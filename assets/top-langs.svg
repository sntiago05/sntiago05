<svg xmlns="http://www.w3.org/2000/svg" width="420" height="250" viewBox="0 0 420 250" role="img" aria-label="Top languages">
  <title>Top languages</title>
  <defs>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#58a6ff"/><stop offset="1" stop-color="#bc8cff"/>
    </linearGradient>
  </defs>
  <style>
  .card { fill: #0d1117; stroke: #30363d; stroke-width: 1; }
  text  { font-family: 'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif; }
  .title { font-size: 17px; font-weight: 600; fill: #58a6ff; }
  .label { font-size: 13px; fill: #c9d1d9; }
  .value { font-size: 13px; font-weight: 600; fill: #f0f6fc; }
  .track { fill: #21262d; }
  .divider { stroke: #21262d; stroke-width: 1; }
  .accent { fill: url(#accent); transform-box: fill-box; transform-origin: left center;
            transform: scaleX(0); animation: grow 1.1s cubic-bezier(.22, 1, .36, 1) .1s forwards; }
  .fade { opacity: 0; animation: fadeIn .6s ease-out forwards; }
  .bar  { transform-box: fill-box; transform-origin: left center; transform: scaleX(0);
          animation: grow 1.1s cubic-bezier(.22, 1, .36, 1) forwards; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); }
                      to   { opacity: 1; transform: translateY(0); } }
  @keyframes grow   { to { transform: scaleX(1); } }
  @media (prefers-reduced-motion: reduce) {
    .fade, .bar, .accent { animation: none; opacity: 1; transform: none; }
  }
</style>
  <rect class="card" x="0.5" y="0.5" width="419" height="249" rx="10"/>
  <text class="title fade" x="24" y="38">Top languages</text>
  <rect class="accent" x="24" y="48" width="120" height="3" rx="1.5"/>
  <g class="fade" style="animation-delay:0.15s"><text class="label" x="24" y="82">Java</text><text class="value" x="396" y="82" text-anchor="end">68.4%</text><rect class="track" x="24" y="89" width="372" height="6" rx="3"/></g>  <rect class="bar" x="24" y="89" width="254.5" height="6" rx="3" fill="#b07219" style="animation-delay:0.40s"/>
  <g class="fade" style="animation-delay:0.25s"><text class="label" x="24" y="110">JavaScript</text><text class="value" x="396" y="110" text-anchor="end">17.9%</text><rect class="track" x="24" y="117" width="372" height="6" rx="3"/></g>  <rect class="bar" x="24" y="117" width="66.8" height="6" rx="3" fill="#f1e05a" style="animation-delay:0.50s"/>
  <g class="fade" style="animation-delay:0.35s"><text class="label" x="24" y="138">HTML</text><text class="value" x="396" y="138" text-anchor="end">5.5%</text><rect class="track" x="24" y="145" width="372" height="6" rx="3"/></g>  <rect class="bar" x="24" y="145" width="20.4" height="6" rx="3" fill="#e34c26" style="animation-delay:0.60s"/>
  <g class="fade" style="animation-delay:0.45s"><text class="label" x="24" y="166">TypeScript</text><text class="value" x="396" y="166" text-anchor="end">3.4%</text><rect class="track" x="24" y="173" width="372" height="6" rx="3"/></g>  <rect class="bar" x="24" y="173" width="12.8" height="6" rx="3" fill="#3178c6" style="animation-delay:0.70s"/>
  <g class="fade" style="animation-delay:0.55s"><text class="label" x="24" y="194">Python</text><text class="value" x="396" y="194" text-anchor="end">2.1%</text><rect class="track" x="24" y="201" width="372" height="6" rx="3"/></g>  <rect class="bar" x="24" y="201" width="7.8" height="6" rx="3" fill="#3572A5" style="animation-delay:0.80s"/>
  <g class="fade" style="animation-delay:0.65s"><text class="label" x="24" y="222">CSS</text><text class="value" x="396" y="222" text-anchor="end">1.6%</text><rect class="track" x="24" y="229" width="372" height="6" rx="3"/></g>  <rect class="bar" x="24" y="229" width="6.0" height="6" rx="3" fill="#663399" style="animation-delay:0.90s"/>
</svg>
