<svg xmlns="http://www.w3.org/2000/svg" width="420" height="250" viewBox="0 0 420 250" role="img" aria-label="GitHub stats">
  <title>GitHub stats</title>
  <defs>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#58a6ff"/><stop offset="1" stop-color="#bc8cff"/>
    </linearGradient>
  </defs>
  <style>
  .card { fill: #0d1117; stroke: #30363d; stroke-width: 1; }
  text  { font-family: 'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif; }
  .title { font-size: 17px; font-weight: 600; fill: #58a6ff; }
  .label { font-size: 13px; fill: #c9d1d9; }
  .value { font-size: 13px; font-weight: 600; fill: #f0f6fc; }
  .track { fill: #21262d; }
  .divider { stroke: #21262d; stroke-width: 1; }
  .accent { fill: url(#accent); transform-box: fill-box; transform-origin: left center;
            transform: scaleX(0); animation: grow 1.1s cubic-bezier(.22, 1, .36, 1) .1s forwards; }
  .fade { opacity: 0; animation: fadeIn .6s ease-out forwards; }
  .bar  { transform-box: fill-box; transform-origin: left center; transform: scaleX(0);
          animation: grow 1.1s cubic-bezier(.22, 1, .36, 1) forwards; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); }
                      to   { opacity: 1; transform: translateY(0); } }
  @keyframes grow   { to { transform: scaleX(1); } }
  @media (prefers-reduced-motion: reduce) {
    .fade, .bar, .accent { animation: none; opacity: 1; transform: none; }
  }
</style>
  <rect class="card" x="0.5" y="0.5" width="419" height="249" rx="10"/>
  <text class="title fade" x="24" y="38">GitHub stats</text>
  <rect class="accent" x="24" y="48" width="120" height="3" rx="1.5"/>
  <g class="fade" style="animation-delay:0.15s"><text class="label" x="24" y="84">Contributions (last year)</text><text class="value" x="396" y="84" text-anchor="end">960</text><line class="divider" x1="24" x2="396" y1="94" y2="94"/></g>
  <g class="fade" style="animation-delay:0.25s"><text class="label" x="24" y="112">Commits (last year)</text><text class="value" x="396" y="112" text-anchor="end">672</text><line class="divider" x1="24" x2="396" y1="122" y2="122"/></g>
  <g class="fade" style="animation-delay:0.35s"><text class="label" x="24" y="140">Pull requests</text><text class="value" x="396" y="140" text-anchor="end">112</text><line class="divider" x1="24" x2="396" y1="150" y2="150"/></g>
  <g class="fade" style="animation-delay:0.45s"><text class="label" x="24" y="168">Issues</text><text class="value" x="396" y="168" text-anchor="end">44</text><line class="divider" x1="24" x2="396" y1="178" y2="178"/></g>
  <g class="fade" style="animation-delay:0.55s"><text class="label" x="24" y="196">Public repositories</text><text class="value" x="396" y="196" text-anchor="end">50</text><line class="divider" x1="24" x2="396" y1="206" y2="206"/></g>
  <g class="fade" style="animation-delay:0.65s"><text class="label" x="24" y="224">Stars earned</text><text class="value" x="396" y="224" text-anchor="end">5</text><line class="divider" x1="24" x2="396" y1="234" y2="234"/></g>
</svg>
